name: Chorus CI

on:
  push:
    paths: ["chorus/**", ".github/workflows/chorus-ci.yml"]
  pull_request:
    paths: ["chorus/**", ".github/workflows/chorus-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chorus
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chorus
          POSTGRES_PASSWORD: chorus
          POSTGRES_DB: chorus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chorus" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chorus/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://chorus:chorus@localhost:5432/chorus_test
